# Socket Registry Firewall — Nexus Upstream topology
# Aligned to the gold-standard reference config (path_routing mode; the
# DNS-override `registries:` mode is deleted per the reference's own guidance).
#
# Nexus proxy repos set Remote storage URL to:
#   https://firewall:8443/npm    (npm format)
#   https://firewall:8443/maven  (maven2 format)
#   https://firewall:8443/pypi   (pypi format)
#
# API token comes from SOCKET_SECURITY_API_TOKEN env (scopes: packages,
# entitlements:list). ${VAR} placeholders are NOT interpolated in this file.

socket:
  api_url: https://api.socket.dev
  api_read_timeout: 60          # short-circuits slow API calls so workers don't hang
  fail_open: false              # block installs when the Socket API is unreachable
  fail_open_unscanned: true     # allow package versions Socket hasn't scanned yet

ports:
  http: 8080
  https: 8443

ssl:
  # fullchain.pem/privkey.pem names are load-bearing: the auto-discovery
  # daemon regenerates config with these default names and bricks nginx if
  # the real files are named anything else (verified on 2.1.1).
  cert: /etc/nginx/ssl/fullchain.pem
  key: /etc/nginx/ssl/privkey.pem

path_routing:
  enabled: true
  domain: firewall
  client_rewrite_scheme: https
  routes:
    - path: /npm
      upstream: https://registry.npmjs.org
      registry: npm
    - path: /pypi
      upstream: https://pypi.org
      registry: pypi
    - path: /maven
      upstream: https://repo1.maven.org/maven2
      registry: maven
    - path: /plugins-gradle
      upstream: https://plugins.gradle.org/m2
      registry: maven
    - path: /nuget
      upstream: https://api.nuget.org
      registry: nuget
    - path: /rubygems
      upstream: https://rubygems.org
      registry: rubygems
    - path: /go
      upstream: https://proxy.golang.org
      registry: go
    - path: /cargo
      upstream: https://index.crates.io
      registry: cargo
    - path: /conda
      upstream: https://repo.anaconda.com
      registry: conda
    - path: /openvsx
      upstream: https://open-vsx.org
      registry: openvsx

# Shared decision cache — one instance here, but enabled to mirror the
# reference config and exercise the code path.
redis:
  enabled: true
  host: redis
  port: 6379
  ttl: 86400

# Hide blocked versions from resolvers so installs fall back to an allowed
# version instead of failing on a 403.
metadata_filtering:
  enabled: true
  include_unchecked_versions: true
  max_versions: 30              # per-package version cap; 30 performs well at scale
  prefetch_max_concurrent: 4
  prefetch_batch_concurrency: 8
  package_filter_timeout: 60

nginx:
  worker_processes: auto
  worker_connections: 32768
  worker_rlimit_nofile: 65536   # must exceed worker_connections or nginx caps them
  open_file_cache:
    max: 2000
    inactive: 120s
