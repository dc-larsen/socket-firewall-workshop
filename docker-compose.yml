# One container. No published host ports -- OrbStack routes
# https://packages.orb.local straight to it and terminates TLS with its own
# root CA, which is already trusted by macOS.
services:
  packages:
    image: socketdev/socket-registry-firewall:${SFW_VERSION:-2.6.1}
    container_name: packages
    environment:
      - SOCKET_SECURITY_API_TOKEN=${SOCKET_SECURITY_API_TOKEN:?set SOCKET_SECURITY_API_TOKEN in .env}
    labels:
      dev.orbstack.http-port: "8080"
    volumes:
      - ./socket.yml:/app/socket.yml:ro
    restart: unless-stopped
