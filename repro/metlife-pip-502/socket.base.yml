# Mirror of MetLife's POC config (Helm values shared 2026-08-21):
# path routing on an internal hostname, rewrite mode (their default -- no
# `mode` key), /npm + /pypi routes, TLS on 443.
socket:
  api_url: https://api.socket.dev
  fail_open: true

ports:
  http: 8080
  https: 443

path_routing:
  enabled: true
  domain: ossfw.metlife.test
  routes:
    - path: /npm
      upstream: https://registry.npmjs.org
      registry: npm

    - path: /pypi
      upstream: https://pypi.org
      registry: pypi

nginx:
  worker_processes: 1
  worker_connections: 4096
